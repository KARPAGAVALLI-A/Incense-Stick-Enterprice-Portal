<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Mobile Portal — Enterprise Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f5f7;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
    }
    [data-theme="dark"] {
      --bg: #0b1220;
      --card-bg: #131b2c;
      --border: #26324a;
      --text: #e5e7eb;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: #0f172a; color: var(--text); padding: 20px 10px; display: flex; justify-content: center; min-height: 100vh; }

    /* Mobile Container Simulator */
    .mobile-wrap { width: 100%; max-width: 420px; background: var(--bg); border-radius: 24px; padding: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; border: 4px solid #1e293b; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    .brand-title { font-size: 16px; font-weight: 800; color: #2563eb; display: flex; align-items: center; gap: 6px; }
    .user-name { font-size: 13px; font-weight: 700; color: var(--text); text-align: right; }
    .user-role { font-size: 11px; color: var(--text-muted); text-align: right; }

    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .badge { font-size: 11px; font-weight: 700; background: #dcfce7; color: #166534; padding: 3px 8px; border-radius: 999px; }

    .progress-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
    .progress-label { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; margin-bottom: 6px; }
    .progress-bar { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: #2563eb; width: 66%; border-radius: 999px; transition: width 0.3s; }

    .task-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .task-left { display: flex; align-items: center; gap: 12px; }
    .checkbox { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #2563eb; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .checkbox.checked { background: #2563eb; color: #fff; }
    .task-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .task-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .footer-btns { margin-top: 20px; }
    .btn-toggle { width: 100%; background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
    .btn-logout { width: 100%; background: #fee2e2; border: 1px solid #fecaca; color: #b91c1c; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; display: block; text-align: center; }
  </style>
</head>
<body>

  <div class="mobile-wrap">
    <div>
      <div class="header">
        <div class="brand-title">⚡ ISE Mobile</div>
        <div>
          <div class="user-name">Alex Miller</div>
          <div class="user-role">Floor Technician (Shift A)</div>
        </div>
      </div>

      <div class="progress-box">
        <div class="progress-label">
          <span>Shift Tasks Completed</span>
          <strong id="taskPercent">2 of 3 (66%)</strong>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="section-head">
        <span class="section-title">Today's Assigned Tasks</span>
        <span class="badge">Shift A</span>
      </div>

      <div class="task-card">
        <div class="task-left">
          <div class="checkbox checked" onclick="toggleTask(this)">✓</div>
          <div>
            <div class="task-title" style="text-decoration: line-through;">Inspect Conveyor Line 1</div>
            <div class="task-sub">Completed at 08:30 AM</div>
          </div>
        </div>
      </div>

      <div class="task-card">
        <div class="task-left">
          <div class="checkbox checked" onclick="toggleTask(this)">✓</div>
          <div>
            <div class="task-title" style="text-decoration: line-through;">Calibrate Sensor Array #4</div>
            <div class="task-sub">Completed at 10:15 AM</div>
          </div>
        </div>
      </div>

      <div class="task-card">
        <div class="task-left">
          <div class="checkbox" onclick="toggleTask(this)"></div>
          <div>
            <div class="task-title">Log Chemical Raw Inventory</div>
            <div class="task-sub">Due by 02:00 PM</div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-btns">
      <button class="btn-toggle" onclick="toggleTheme()">🌓 Toggle Theme Mode</button>
      <a href="login.html" class="btn-logout">🚪 Sign Out to Login</a>
    </div>
  </div>

  <script>
    function toggleTask(el) {
      el.classList.toggle('checked');
      if (el.classList.contains('checked')) el.innerText = '✓';
      else el.innerText = '';
    }

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }
  </script>

</body>
</html>
