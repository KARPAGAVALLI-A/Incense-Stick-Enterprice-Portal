<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports & Analytics — Enterprise Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f4f5f7; --card-bg: #ffffff; --border: #e5e7eb; --text: #111827; --text-muted: #6b7280; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { display: flex; min-height: 100vh; background: var(--bg); color: var(--text); }
    .sidebar { width: 240px; background: #0f172a; color: #e2e8f0; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; }
    .nav-link { display: flex; gap: 10px; align-items: center; width: 100%; color: #cbd5e1; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 4px; text-decoration: none; }
    .nav-link.active { background: #2563eb; color: #fff; font-weight: 600; }
    .content { flex: 1; padding: 32px; overflow-y: auto; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div>
      <div style="font-weight: 800; font-size: 16px; margin-bottom: 24px; color: #2563eb;">⚡ ISE Console</div>
      <nav>
        <a href="admin-dashboard.html" class="nav-link">📊 Dashboard</a>
        <a href="inventory.html" class="nav-link">📦 Inventory</a>
        <a href="production.html" class="nav-link">⚙️ Production</a>
        <a href="logistics.html" class="nav-link">🚚 Logistics</a>
        <a href="employees.html" class="nav-link">👥 Employees</a>
        <a href="reports.html" class="nav-link active">📈 Reports</a>
        <a href="settings.html" class="nav-link">🛠️ Settings</a>
      </nav>
    </div>
    <a href="login.html" class="nav-link" style="color: #f87171;">🚪 Sign Out</a>
  </div>
  <div class="content">
    <div style="font-size: 12px; font-weight: 600; color: #2563eb; text-transform: uppercase;">Executive Intelligence</div>
    <h1 style="font-size: 24px; font-weight: 700; margin: 4px 0 20px;">Reports & Monthly Performance Analytics</h1>
    <div class="card">
      <h2 style="font-size: 15px; font-weight: 700; margin-bottom: 10px;">Monthly Production Output vs Target</h2>
      <div style="display: flex; gap: 20px; align-items: flex-end; height: 180px; padding-top: 20px; border-bottom: 1px solid #e5e7eb;">
        <div style="flex: 1; background: #2563eb; height: 60%; border-radius: 6px 6px 0 0; text-align: center; color: #fff; font-size: 11px; padding-top: 6px;">Wk 1 (60%)</div>
        <div style="flex: 1; background: #2563eb; height: 80%; border-radius: 6px 6px 0 0; text-align: center; color: #fff; font-size: 11px; padding-top: 6px;">Wk 2 (80%)</div>
        <div style="flex: 1; background: #2563eb; height: 95%; border-radius: 6px 6px 0 0; text-align: center; color: #fff; font-size: 11px; padding-top: 6px;">Wk 3 (95%)</div>
        <div style="flex: 1; background: #16a34a; height: 98%; border-radius: 6px 6px 0 0; text-align: center; color: #fff; font-size: 11px; padding-top: 6px;">Wk 4 (98%)</div>
      </div>
    </div>
  </div>
</body>
</html>
