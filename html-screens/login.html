<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Enterprise Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f5f7; }
    
    .login-panel { display: flex; width: 840px; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.12); }
    .login-left { width: 45%; background: #0f172a; color: #fff; padding: 40px; display: flex; flex-direction: column; justify-content: space-between; }
    .logo-brand { font-size: 28px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .logo-box { width: 40px; height: 40px; background: #2563eb; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    
    .hero-text h2 { font-size: 22px; font-weight: 700; line-height: 1.3; margin-top: 20px; }
    .hero-text p { font-size: 13px; color: #94a3b8; margin-top: 10px; line-height: 1.5; }
    
    .status-box { font-size: 11px; color: #64748b; margin-top: 40px; border-top: 1px solid #1e293b; padding-top: 16px; }
    .status-val { font-size: 13px; color: #4ade80; font-weight: 600; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; display: inline-block; }

    .login-right { width: 55%; background: #ffffff; padding: 40px; }
    .form-title { font-size: 22px; font-weight: 700; color: #111827; }
    .form-sub { font-size: 13px; color: #6b7280; margin-bottom: 24px; margin-top: 4px; }
    
    .field { margin-bottom: 16px; }
    label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 6px; color: #374151; }
    input, select { width: 100%; border: 1px solid #d1d5db; border-radius: 8px; padding: 12px; font-size: 13px; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus { border-color: #2563eb; }
    
    .submit-btn { width: 100%; background: #0f172a; color: #ffffff; border: none; border-radius: 8px; padding: 14px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .submit-btn:hover { background: #1e293b; }

    .back-link { display: inline-block; margin-top: 20px; font-size: 12px; color: #2563eb; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <div class="login-panel">
    <div class="login-left">
      <div>
        <div class="logo-brand">
          <div class="logo-box">⚡</div>
          <span>ISE Console</span>
        </div>
        <div class="hero-text">
          <h2>Enterprise Operations & Intelligence Platform</h2>
          <p>Real-time telemetry, AI anomaly detection, inventory reorder risk, and fleet logistics.</p>
        </div>
      </div>
      <div class="status-box">
        SYSTEM STATUS
        <div class="status-val"><span class="dot"></span> All Systems Operational</div>
      </div>
    </div>

    <div class="login-right">
      <h1 class="form-title">Sign In to Console</h1>
      <p class="form-sub">Select your user role to launch screen dashboard.</p>

      <form onsubmit="handleLogin(event)">
        <div class="field">
          <label>Select User Role</label>
          <select id="roleSelect" onchange="updateRoleDefaults()">
            <option value="Admin">Admin (Full Access)</option>
            <option value="Plant Manager">Plant Manager</option>
            <option value="Employee">Employee (Mobile Tech)</option>
          </select>
        </div>

        <div class="field">
          <label>Email Address</label>
          <input type="email" id="emailInput" value="admin@enterprise.com" required>
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" value="••••••••••••" required>
        </div>

        <button type="submit" class="submit-btn">Launch Selected Role Console →</button>
      </form>

      <a href="index.html" class="back-link">← Back to HTML Screens Navigator</a>
    </div>
  </div>

  <script>
    function updateRoleDefaults() {
      const role = document.getElementById('roleSelect').value;
      const email = document.getElementById('emailInput');
      if (role === 'Admin') email.value = 'admin@enterprise.com';
      else if (role === 'Plant Manager') email.value = 'manager@enterprise.com';
      else email.value = 'alex.m@enterprise.com';
    }

    function handleLogin(e) {
      e.preventDefault();
      const role = document.getElementById('roleSelect').value;
      if (role === 'Admin') window.location.href = 'admin-dashboard.html';
      else if (role === 'Plant Manager') window.location.href = 'manager-dashboard.html';
      else window.location.href = 'employee-dashboard.html';
    }
  </script>

</body>
</html>
